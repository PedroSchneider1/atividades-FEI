services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccm140:pyzmq_taskmgr
    container_name: broker_taskmgr
    volumes:
      - ./broker.py:/app/main.py
    ports:
      - 5555:5555
      - 5556:5556

  servidor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccm140:pyzmq_taskmgr
    container_name: servidor_taskmgr
    volumes:
      - ./servidor.py:/app/main.py
    depends_on:
      - broker
    deploy:
      replicas: 1

  cliente:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccm140:pyzmq_taskmgr
    container_name: cliente_taskmgr
    volumes:
      - ./cliente.py:/app/main.py
    depends_on:
      - servidor
    deploy:
      replicas: 1
